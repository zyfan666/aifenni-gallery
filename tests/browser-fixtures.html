<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发故障检查夹具（不随生产构建发布）</title><style>#qa-tools{padding:12px;background:#fff3cb;color:#333;font:14px sans-serif}#qa-tools select,#qa-tools button{min-height:44px}</style><body><div id="qa-tools"><label for="qa-mode">开发检查场景</label><select id="qa-mode"><option value="normal">正常</option><option value="image">作品图片缺失</option><option value="export">图片导出失败</option><option value="clipboard">复制受限</option><option value="offline">断网状态与加载失败</option></select><button id="qa-apply">应用场景</button><p id="qa-status" role="status">当前：正常；仅测试夹具，不代表已切换系统网络。</p></div><div id="root"></div><script>
let qaMode='normal';const originalSource=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');Object.defineProperty(HTMLImageElement.prototype,'src',{...originalSource,set(value){const fail=(qaMode==='image'||qaMode==='offline')&&String(value).includes('/art/')&&!String(value).includes('/thumb/');return originalSource.set.call(this,fail?'/__qa_missing_art__.png':value);}});const originalAttribute=Element.prototype.setAttribute;Element.prototype.setAttribute=function(name,value){const fail=this instanceof HTMLImageElement&&name==='src'&&(qaMode==='image'||qaMode==='offline')&&String(value).includes('/art/')&&!String(value).includes('/thumb/');return originalAttribute.call(this,name,fail?'/__qa_missing_art__.png':value);};const originalBlob=HTMLCanvasElement.prototype.toBlob;HTMLCanvasElement.prototype.toBlob=function(callback,...args){if(qaMode==='export'){setTimeout(()=>callback(null),0);return;}return originalBlob.call(this,callback,...args);};const actualClipboard=navigator.clipboard;Object.defineProperty(navigator,'clipboard',{configurable:true,get:()=>qaMode==='clipboard'?{writeText:()=>Promise.reject(new Error('QA clipboard denied'))}:actualClipboard});const actualOnline=navigator.onLine;Object.defineProperty(navigator,'onLine',{configurable:true,get:()=>qaMode==='offline'?false:actualOnline});document.getElementById('qa-apply').onclick=()=>{qaMode=document.getElementById('qa-mode').value;document.getElementById('qa-status').textContent='当前：'+qaMode+'；仅测试夹具，不代表已切换系统网络。';window.dispatchEvent(new Event(qaMode==='offline'?'offline':'online'));};
</script><script type="module" src="/src/main.jsx"></script></body></html>
